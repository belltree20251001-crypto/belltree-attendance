
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#527b61">
  <meta name="description" content="ベルツリーケアプランセンター 出退勤アプリ">
  <title>ベルツリー出退勤</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f3f6f2;
      color: #34443a;
    }
    header {
      background: #527b61;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }
    header h1 {
      font-size: 22px;
      margin: 0;
      letter-spacing: 1px;
    }
    header p {
      margin: 6px 0 0;
      font-size: 12px;
    }
    main {
      max-width: 650px;
      margin: 18px auto;
      padding: 0 12px;
    }
    .app-card {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 3px 12px #00000012;
    }
    .notice {
      text-align: center;
      font-size: 13px;
      color: #65756a;
      margin: 12px 0;
    }
    iframe {
      width: 100%;
      height: 760px;
      border: 0;
      border-radius: 10px;
      background: white;
    }
    .open-link {
      display: block;
      text-align: center;
      margin: 14px 0;
      color: #527b61;
      font-size: 14px;
    }
    footer {
      text-align: center;
      color: #89958c;
      font-size: 11px;
      padding: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ベルツリー出退勤</h1>
    <p>ベルツリーケアプランセンター</p>
  </header>

  <main>
    <div class="app-card">
      <p class="notice">職員の皆さまはこちらから出退勤を打刻してください。</p>

      <iframe
        src="https://script.google.com/macros/s/AKfycbwQ6hcpFYBe8qrAkeAumnC-jO_C7QuwTihVRJXRooSpWJo9olsv_YQ0GswkFn3mZnFL/exec"
        title="ベルツリー出退勤システム"
        allow="clipboard-read; clipboard-write">
      </iframe>

      <a class="open-link"
         href="https://script.google.com/macros/s/AKfycbwQ6hcpFYBe8qrAkeAumnC-jO_C7QuwTihVRJXRooSpWJo9olsv_YQ0GswkFn3mZnFL/exec"
         target="_blank">
        画面が表示されない場合はこちら
      </a>
    </div>
  </main>

  <footer>
    © ベルツリーケアプランセンター
  </footer>
</body>
</html>
